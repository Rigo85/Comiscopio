name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Unit tests ────────────────────────────────────────────────────────────
  # Fast: vitest only, no workers needed.
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ── 2. Build Linux ───────────────────────────────────────────────────────────
  # Blocked by unit tests. Produces two artifacts:
  #   linux-builds  — AppImage + tar.gz  (for the release job)
  #   linux-native  — native workers only (for the functional test job)
  build-linux:
    needs: [test-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Builds native workers inside a Docker Ubuntu 22.04 container (glibc 2.35 / GCC 11)
      # to avoid glibc 2.38 symbol contamination from the ubuntu-latest runner (GCC 14).
      # Bundles all shared library dependencies with patchelf so the AppImage is self-contained.
      - name: Build native workers (Docker)
        run: npm run build:native-linux

      - name: Build Angular + Electron
        run: npm run build

      - name: Package Linux
        run: NODE_NO_WARNINGS=1 npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: release/*.{AppImage,tar.gz}

      - name: Upload native workers (for functional tests)
        uses: actions/upload-artifact@v4
        with:
          name: linux-native
          path: release/linux-unpacked/resources/native/

  # ── 3. Functional tests ──────────────────────────────────────────────────────
  # Runs the worker test suite directly on the ubuntu-latest runner using the
  # exact workers that will be shipped. No Docker matrix here — that is for
  # local pre-release validation across distros (npm run test:functional).
  test-functional:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native workers
        uses: actions/download-artifact@v4
        with:
          name: linux-native
          path: ci-native/

      - name: Mark worker binaries executable
        run: chmod +x ci-native/bin/*

      - name: Run functional tests
        run: |
          bash test/workers/run-worker-tests.sh \
            --native-dir ci-native \
            --fixtures-dir test/fixtures

  # ── 4. Release ───────────────────────────────────────────────────────────────
  # Only runs when both test jobs and the build pass.
  release:
    needs: [test-functional]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
