name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Builds native workers inside a Docker Ubuntu 22.04 container (glibc 2.35 / GCC 11)
      # to avoid glibc 2.38 symbol contamination from the ubuntu-latest runner (GCC 14).
      # Bundles all shared library dependencies with patchelf so the AppImage is self-contained.
      - name: Build native workers (Docker)
        run: npm run build:native-linux

      - name: Build Angular + Electron
        run: npm run build

      - name: Package Linux
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: release/*.{AppImage,tar.gz}

  # ---------------------------------------------------------------------------
  # Windows build — pending native worker support for Win32
  # ---------------------------------------------------------------------------
  # build-windows:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #
  #     - name: Install dependencies
  #       run: npm ci
  #
  #     - name: Build
  #       run: npm run build
  #
  #     - name: Package Windows
  #       run: npx electron-builder --win
  #       env:
  #         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #
  #     - name: Upload artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: windows-builds
  #         path: release/*.{exe,zip}

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
