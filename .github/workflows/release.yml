name: Build, Test & Release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-ace-fixture.cjs
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.cjs
      - run: npm run build:app
      - run: npm run test:unit
      - run: node scripts/test-database.cjs
      - name: Build portable native readers (Ubuntu 22.04 ABI)
        run: npm run build:portable
      - name: Test bundled readers
        run: |
          npm run test:workers
          npm run test:workers:portable
        env:
          COMISCOPIO_NATIVE_DIR: native/vendor/linux-x64
      - name: Package without publishing
        run: npx electron-builder --linux --publish never
      - name: Test packaged application
        run: xvfb-run --auto-servernum npm run test:packaged
        env:
          COMISCOPIO_APP_BINARY: release/linux-unpacked/comiscopio
      - name: Test AppImage and extracted tar archive
        run: xvfb-run --auto-servernum npm run test:linux-artifacts
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-test-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload validated builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-builds
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-ace-fixture.cjs
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make patch gcc
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-libvips
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-libheif
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-libmupdf
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.cjs
      - name: Build native readers and run CTest
        shell: msys2 {0}
        run: bash native/deps/build-windows-x64.sh
      - run: npm run build:app
      - run: npm run test:unit
      - run: node scripts/test-database.cjs
      - name: Test bundled readers
        run: npm run test:workers:portable
        env:
          COMISCOPIO_NATIVE_DIR: native/vendor/win32-x64
      - name: Package portable EXE and ZIP without publishing
        run: npx electron-builder --win --publish never
      - name: Test packaged application
        run: npm run test:packaged
        env:
          COMISCOPIO_APP_BINARY: release/win-unpacked/Comiscopio.exe
      - name: Test extracted ZIP, blocked processes and portable EXE
        run: npm run test:windows-artifacts
      - name: Preserve test diagnostics and native versions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-reports
          path: |
            test-results/
            native/vendor/win32-x64/*versions.txt
            native/worker/build-win/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload validated builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-builds
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-builds'
          path: artifacts
          merge-multiple: true
      - name: Publish the tested artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$GITHUB_WORKSPACE/docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          cd artifacts
          # GitHub replaces spaces in uploaded asset names with periods.
          # Rename first so SHA256SUMS also matches the downloaded filenames.
          for file in ./*; do
            uploaded_name="${file// /.}"
            if [[ "$file" != "$uploaded_name" ]]; then
              test ! -e "$uploaded_name"
              mv -- "$file" "$uploaded_name"
            fi
          done
          sha256sum ./* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --notes-file "$notes" --title "Comiscopio $RELEASE_TAG"
